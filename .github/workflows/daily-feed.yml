name: Build daily MarketEar feed

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Optional selected YouTube video ID
        required: false
        type: string
      title_chinese:
        description: Optional Chinese title
        required: false
        type: string
      summary:
        description: Optional Chinese summary
        required: false
        type: string
      translate_existing:
        description: Translate the existing today.json without selecting or transcribing a new video
        required: false
        default: false
        type: boolean
  schedule:
    # Primary: 06:45 Asia/Shanghai. Retry: 08:10, after the Workers AI
    # daily free allocation resets at 00:00 UTC. The retry exits immediately
    # when the primary run has already published today's story.
    - cron: "45 22 * * *"
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-marketear-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fail-closed feed tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check whether this run needs to update the feed
        id: freshness
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/schedule_freshness.py --story today.json

      - name: Install channel metadata reader
        if: ${{ steps.freshness.outputs.needs_update == 'true' && inputs.translate_existing != true }}
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]"

      - name: Generate timestamped daily story
        if: ${{ steps.freshness.outputs.needs_update == 'true' && inputs.translate_existing != true }}
        env:
          YOUTUBE_TRANSCRIPT_API_KEY: ${{ secrets.YOUTUBE_TRANSCRIPT_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE_CHINESE: ${{ inputs.title_chinese }}
          SUMMARY: ${{ inputs.summary }}
        run: python scripts/generate_daily.py --output candidate.json --current today.json --history history.json

      - name: Prepare existing story for translation
        if: ${{ steps.freshness.outputs.needs_update == 'true' && inputs.translate_existing == true }}
        run: cp today.json candidate.json

      - name: Generate and independently review sentence-locked financial Chinese
        if: ${{ steps.freshness.outputs.needs_update == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/translate_finance.py --input candidate.json --output candidate.json

      - name: Validate and atomically promote complete story
        if: ${{ steps.freshness.outputs.needs_update == 'true' }}
        run: python scripts/publish_feed.py --candidate candidate.json --output today.json --last-good last_good.json --history history.json

      - name: Publish changed feed
        if: ${{ steps.freshness.outputs.needs_update == 'true' }}
        run: |
          git add today.json last_good.json history.json
          if git diff --cached --quiet -- today.json last_good.json history.json; then
            echo "Feed is already current"
            exit 0
          fi
          git config user.name "marketear-feed-bot"
          git config user.email "marketear-feed-bot@users.noreply.github.com"
          git commit -m "Update daily MarketEar story"
          git push
