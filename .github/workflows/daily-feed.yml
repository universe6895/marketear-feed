name: Build daily MarketEar feed

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Optional selected YouTube video ID
        required: false
        type: string
      title_chinese:
        description: Optional Chinese title
        required: false
        type: string
      summary:
        description: Optional Chinese summary
        required: false
        type: string
      translate_existing:
        description: Translate the existing today.json without selecting or transcribing a new video
        required: false
        default: false
        type: boolean
  schedule:
    # 06:45 Asia/Shanghai. GitHub schedules use UTC.
    - cron: "45 22 * * *"

permissions:
  contents: write

concurrency:
  group: daily-marketear-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio access dependencies
        if: ${{ inputs.translate_existing != true }}
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp[default]" "bgutil-ytdlp-pot-provider==1.3.1"
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install --yes cloudflare-warp

      - name: Connect free Cloudflare WARP proxy
        if: ${{ inputs.translate_existing != true }}
        run: |
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 5
          curl --fail --silent --show-error --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace

      - name: Generate timestamped daily story
        if: ${{ inputs.translate_existing != true }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YTDLP_PROXY: socks5h://127.0.0.1:40000
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE_CHINESE: ${{ inputs.title_chinese }}
          SUMMARY: ${{ inputs.summary }}
        run: python scripts/generate_daily.py --output today.json

      - name: Generate context-aware financial Chinese
        id: financial_translation
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/translate_finance.py --input today.json --output today.json

      - name: Report translation fallback
        if: ${{ steps.financial_translation.outcome == 'failure' }}
        run: echo '::warning::Financial translation was unavailable; the app will retain iPhone Translation.'

      - name: Publish changed feed
        run: |
          git add today.json history.json
          if git diff --cached --quiet -- today.json history.json; then
            echo "Feed is already current"
            exit 0
          fi
          git config user.name "marketear-feed-bot"
          git config user.email "marketear-feed-bot@users.noreply.github.com"
          git commit -m "Update daily MarketEar story"
          git push
