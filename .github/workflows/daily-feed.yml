name: MarketEar caption credential check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect existing YouTubeTranscript.dev response without extracting captions
        env:
          YOUTUBE_TRANSCRIPT_API_KEY: ${{ secrets.YOUTUBE_TRANSCRIPT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          key = os.environ.get("YOUTUBE_TRANSCRIPT_API_KEY", "").strip()
          if not key:
              raise SystemExit("YouTubeTranscript.dev secret is missing.")
          request = Request(
              "https://www.youtubetranscript.dev/api/v2/transcripts?limit=1",
              headers={"Authorization": "Bearer " + key, "Accept": "application/json"},
          )
          try:
              with urlopen(request, timeout=20) as response:
                  data = json.load(response)
                  print(f"HTTP {response.status}; response fields: {', '.join(sorted(data))}")
          except HTTPError as exc:
              raise SystemExit(f"YouTubeTranscript.dev HTTP {exc.code}") from None
          for name in ("credits_remaining", "remaining_credits"):
              if type(data.get(name)) is int:
                  print(f"{name}: {data[name]}")
          if not any(isinstance(data.get(name), list) for name in ("transcripts", "data", "items")):
              raise SystemExit("Unrecognized transcript-list schema.")
          PY
