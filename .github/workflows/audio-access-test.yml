name: Test free YouTube audio access

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID
        required: true
        default: TTzKYBNkd_k
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp and Cloudflare WARP
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp[default]" "bgutil-ytdlp-pot-provider==1.3.1"
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install --yes cloudflare-warp

      - name: Connect free WARP proxy
        run: |
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 5
          curl --fail --silent --show-error --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace

      - name: Verify Bloomberg audio extraction
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          mkdir -p /tmp/marketear-audio
          yt-dlp --proxy socks5h://127.0.0.1:40000 --no-playlist --format "bestaudio[ext=m4a]/bestaudio[ext=webm]/bestaudio" --output "/tmp/marketear-audio/source.%(ext)s" "https://www.youtube.com/watch?v=${VIDEO_ID}"
          find /tmp/marketear-audio -type f -maxdepth 1 -printf "%f %s bytes\n"
